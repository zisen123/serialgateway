# serial-gateway.yaml
gateway:
  http_port: 18080

serial_defaults:
  baudrate: 115200
  timeout: 5s
  bytesize: 8
  parity: "N"
  stopbits: 1
  write_timeout: 10s

ring_buffer:
  max_lines: 100000
  max_bytes: 10485760

ssh:
  base_port: 2200
  auth:
    type: "password"

reconnect:
  initial_interval: 1s
  max_interval: 30s
  discard_input_on_disconnect: true

reverse_tunnel:
  host: "172.25.4.7"
  port: 22
  user: "yicong.wu"
  private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
  # Port exposed on the remote SSH server for reaching the LAN host's SSH service
  remote_port: 10022
  # LAN host reached through the tunnel (the cvitek board)
  target_host: "192.168.1.10"
  local_port: 22
  bind_address: "127.0.0.1"

adb_reverse_tunnel:
  host: "172.25.4.7"
  port: 22
  user: "yicong.wu"
  private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
  remote_port: 15037
  local_port: 5037
  bind_address: "127.0.0.1"

logging:
  level: "info"
  format: "text"
  output: "file"
  file_path: "gateway.log"
  max_size_mb: 100
  max_age_days: 30
  max_backups: 7
  compress: true

ports:
  - device: "COM3"
    baudrate: 115200
  - device: "COM25"
    baudrate: 115200
  - device: "COM21"
    baudrate: 115200