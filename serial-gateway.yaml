# serial-gateway.yaml
gateway:
  http_port: 18080

serial_defaults:
  baudrate: 115200
  timeout: 5s
  bytesize: 8
  parity: "N"
  stopbits: 1
  write_timeout: 10s

ring_buffer:
  max_lines: 100000
  max_bytes: 10485760

ssh:
  base_port: 2200
  auth:
    type: "password"

reconnect:
  initial_interval: 1s
  max_interval: 30s
  discard_input_on_disconnect: true

reverse_tunnel:
  host: "10.80.38.24"
  port: 22
  user: "yicong.wu"
  private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
  # Port exposed on the remote SSH server for reaching the local gateway HTTP API
  remote_port: 18080
  # Forward to the local gateway HTTP API
  target_host: "127.0.0.1"
  local_port: 18080
  # tcp = raw TCP forwarding, ssh_proxy = gateway terminates SSH with stable host_key
  mode: "tcp"
  # Used only in ssh_proxy mode
  # target_user: "root"
  # target_password: ""
  # target_private_key_file: "C:/path/to/board/key"
  bind_address: "127.0.0.1"

adb_reverse_tunnel:
  host: "10.80.38.24"
  port: 22
  user: "yicong.wu"
  private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
  remote_port: 15037
  local_port: 5037
  bind_address: "127.0.0.1"

# Expose every COM port's serial-SSH server on the remote host over one
# connection, using the SAME port numbers as locally (COM3 -> 2203, COM25 -> 2225).
# Ports are auto-derived from `ports` + `ssh.base_port`; per-port fields are ignored.
# On the remote host: `ssh -p 2203 <user>@<host>` reaches COM3.
# bind_address 0.0.0.0 requires `GatewayPorts yes` in the server's sshd_config;
# otherwise sshd rewrites the bind to 127.0.0.1 and the LAN can't reach it.
# Set host: "" to disable.
serial_ssh_tunnel:
  host: "10.80.38.24"
  port: 22
  user: "yicong.wu"
  private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
  bind_address: "0.0.0.0"

# Arbitrary number of extra reverse tunnels, on top of the three named ones
# above. Each entry is a single remote_port -> target_host:local_port forward
# by default; set kind: "serial_ssh" to auto-derive per-COM-port forwards like
# serial_ssh_tunnel. Entries with an empty host are skipped. `name` is only used
# for logging. Leave the list empty (or omit it) to add none.
reverse_tunnels:
  # Convention for reversing host-side SSH: remote_port = 10000 + last octet of
  # target_host (all targets live in 192.168.42.x). So 192.168.42.1 -> 10001,
  # .5 -> 10005. Ports stay manual; this rule just keeps them collision-free and
  # readable as you add more IPs. On the remote host:
  #   `ssh -p 10001 <user>@127.0.0.1`  reaches 192.168.42.1
  - name: "host-192.168.42.1-ssh"
    host: "10.80.38.24"
    port: 22
    user: "yicong.wu"
    private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
    remote_port: 10001
    target_host: "192.168.42.1"
    local_port: 22
    bind_address: "127.0.0.1"
  # Expose THIS machine's own sshd to the server, so the server can log into
  # this Windows box:  ssh -p 10006 yicong.wu@127.0.0.1  (from the server).
  # Auth: the server's ~/.ssh/id_rsa is in this machine's authorized_keys.
  - name: "host-192.168.1.6-ssh"
    host: "10.80.38.24"
    port: 22
    user: "yicong.wu"
    private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
    remote_port: 10006
    target_host: "127.0.0.1"
    local_port: 22
    bind_address: "127.0.0.1"
  # Local forward (SSH -L): expose the server's opencli daemon (server-side
  # 127.0.0.1:19825) on THIS machine's 127.0.0.1:19825, so local tools/Chrome
  # extension hit localhost:19825 and transparently reach the server daemon.
  #   listen  bind_address:local_port  = 127.0.0.1:19825 (this machine)
  #   dial    target_host:remote_port  = 127.0.0.1:19825 (server side)
  - name: "opencli-19825"
    kind: "local_forward"
    host: "10.80.38.24"
    port: 22
    user: "yicong.wu"
    private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
    bind_address: "127.0.0.1"
    local_port: 19825
    target_host: "127.0.0.1"
    remote_port: 19825
  # - name: "extra-http"
  #   host: "10.80.38.24"
  #   port: 22
  #   user: "yicong.wu"
  #   private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
  #   remote_port: 19090
  #   target_host: "192.168.1.50"
  #   local_port: 8080
  #   bind_address: "127.0.0.1"
  - name: "board-ssh"
    host: "10.80.38.24"
    port: 22
    user: "yicong.wu"
    private_key_file: "C:/Users/yicong.wu/.ssh/id_ed25519"
    remote_port: 10022
    target_host: "192.168.1.10"
    local_port: 22
    mode: "ssh_proxy"
    target_user: "root"
    target_password: "CHANGE_ME"

logging:
  level: "info"
  format: "text"
  output: "file"
  file_path: "gateway.log"
  max_size_mb: 100
  max_age_days: 30
  max_backups: 7
  compress: true

ports:
  - device: "COM3"
    baudrate: 115200
  - device: "COM25"
    baudrate: 115200
  - device: "COM21"
    baudrate: 115200
  - device: "COM15"
    baudrate: 115200
  - device: "COM34"
    baudrate: 115200
  - device: "COM38"
    baudrate: 115200